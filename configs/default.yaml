# Default experiment configuration
solver:
  name: scip
  time_limit: 3600
  seed: 42

llm:
  model: gpt-4
  temperature: 0.0
  voting_count: 3  # multi-LLM voting

branching:
  initial_rule: relpscost
  candidates:
    - fullstrong
    - pseudocost
    - mostinf
    - relpscost
  switch_check_interval: 50  # steps between LLM queries

benchmarks:
  - name: set_covering
    sizes: [500, 1000]
    instances: 10
  - name: combinatorial_auctions
    sizes: [500, 1000]
    instances: 10
  - name: facility_location
    sizes: [500, 1000]
    instances: 10
  - name: max_independent_set
    sizes: [500, 1000]
    instances: 10
